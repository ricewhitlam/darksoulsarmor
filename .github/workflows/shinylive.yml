## Publishes the app to GitHub Pages, running in the browser through Shinylive, on every push to
## main (or by hand) - once r-universe has built the WebAssembly package for that same version, so
## the site never pairs new app files with an older package. r-universe rebuilds when the version
## changes, so a change to the package's R or C++ code needs a version bump to reach the site.
name: Deploy the app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

## A newer push cancels a run still waiting on an older commit
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      ## The whole history, to find when the version last changed
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      ## Stop before publishing if the package's code has changed since the version last did: that
      ## code would never reach r-universe, so the site would pair it with the older package
      - name: Check the package's code hasn't changed since the version last did
        run: |
          bumped=$(git log -1 --format=%H -G '^Version:' -- DESCRIPTION)
          if ! git diff --quiet "$bumped" HEAD -- R src data NAMESPACE; then
            echo "R/, src/, data/ or NAMESPACE changed since the version was last bumped ($(git log -1 --format='%h %s' "$bumped")):"
            git diff --stat "$bumped" HEAD -- R src data NAMESPACE
            echo "Bump the version in DESCRIPTION so r-universe rebuilds the package, then push again."
            exit 1
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install shinylive and the package
        run: Rscript -e 'install.packages(c("shinylive", "darksoulsarmor"), repos = c("https://ricewhitlam.r-universe.dev", getOption("repos")))'
      ## Export, then check which version of the package the site bundled: shinylive fetches
      ## r-universe's WebAssembly build for whatever R version webR runs, so this checks what will
      ## actually go live. Until r-universe has built this version, wait and export again.
      - name: Export the app with r-universe's WebAssembly build of this version
        run: |
          version=$(grep '^Version:' DESCRIPTION | sed 's/Version: *//' | tr -d '\r')
          for i in $(seq 1 24); do
            rm -rf _site
            Rscript -e 'shinylive::export("inst/shiny", "_site")'
            if [ -f "_site/shinylive/webr/packages/darksoulsarmor/darksoulsarmor_${version}.tgz" ]; then exit 0; fi
            echo "The bundled package isn't version $version yet; waiting for r-universe"
            sleep 300
          done
          echo "r-universe hasn't built version $version after 2 hours"; exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
